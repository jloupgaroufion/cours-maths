<style>
:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}a{color:var(--blue)}

aside{background:var(--paper);border-right:1px solid var(--line);padding:20px 13px;position:sticky;top:0;height:100vh;overflow:auto}

const chapters=[
{
 id:"logique", title:"Logique et ensembles", icon:"01",
 subtitle:"Quantificateurs, opérations ensemblistes, produits et applications.",
 blocks:[
 ["Quantificateurs et raisonnement",`
 <p>Une proposition comportant <span class="math">∀x∈E</span> affirme quelque chose pour <em>tout</em> élément de <span class="math">E</span>. La proposition <span class="math">∃x∈E</span> demande au moins un témoin. L'ordre des quantificateurs importe : <span class="math">∀x∃y</span> n'est pas, en général, équivalent à <span class="math">∃y∀x</span>.</p>
 <div class="formula">¬(∀x∈E, P(x)) ⇔ ∃x∈E, ¬P(x) ; &nbsp; ¬(∃x∈E, P(x)) ⇔ ∀x∈E, ¬P(x).</div>
 <p>Pour prouver <span class="math">P⇒Q</span>, on suppose <span class="math">P</span> et on démontre <span class="math">Q</span>. Par contraposée, on prouve <span class="math">¬Q⇒¬P</span>. Pour réfuter un énoncé universel, un contre-exemple suffit ; pour prouver une équivalence, on établit les deux implications.</p>
 <p>Une preuve par récurrence comporte une initialisation à un rang précis et une hérédité : supposer <span class="math">P(n)</span>, démontrer <span class="math">P(n+1)</span>.</p>`],
 ["Ensembles et opérations",`
 <p><span class="math">A⊆B</span> signifie <span class="math">∀x, x∈A⇒x∈B</span>. Pour démontrer <span class="math">A=B</span>, montrer les deux inclusions. L'union contient les éléments présents dans au moins l'un des ensembles ; l'intersection ceux présents dans les deux.</p>
 <div class="formula">A∩(B∪C)=(A∩B)∪(A∩C) ; &nbsp; A∪(B∩C)=(A∪B)∩(A∪C).</div>
 <p>Dans un univers <span class="math">E</span>, le complémentaire de <span class="math">A</span> est <span class="math">E∖A</span>. Les lois de De Morgan donnent <span class="math">E∖(A∪B)=(E∖A)∩(E∖B)</span> et <span class="math">E∖(A∩B)=(E∖A)∪(E∖B)</span>.</p>
 <p><span class="math">A×B={(a,b):a∈A,b∈B}</span> est un ensemble de <em>couples ordonnés</em>. En général, <span class="math">(a,b)≠(b,a)</span>. L'ensemble des parties de <span class="math">E</span> est noté <span class="math">𝒫(E)</span>.</p>`],
 ["Applications",`
 <p>Une application <span class="math">f:E→F</span> associe à chaque élément de <span class="math">E</span> une unique image dans <span class="math">F</span>. <strong>Injective :</strong> <span class="math">f(x)=f(y)⇒x=y</span>. <strong>Surjective :</strong> chaque élément de <span class="math">F</span> possède au moins un antécédent. <strong>Bijective :</strong> injective et surjective ; elle admet une application réciproque <span class="math">f⁻¹:F→E</span>.</p>
 <p>Pour <span class="math">A⊆E</span>, l'image directe est <span class="math">f(A)={f(x):x∈A}</span>. Pour <span class="math">B⊆F</span>, l'image réciproque <span class="math">f⁻¹(B)={x∈E:f(x)∈B}</span> existe <em>même si f n'est pas bijective</em> : ne pas confondre image réciproque d'un ensemble et application réciproque.</p>
 <div class="formula">f⁻¹(B∪C)=f⁻¹(B)∪f⁻¹(C) ; &nbsp; f⁻¹(B∩C)=f⁻¹(B)∩f⁻¹(C).</div>`],
 ["Ensembles finis",`
 <p>Le cardinal <span class="math">|E|</span> compte les éléments d'un ensemble fini. Si <span class="math">A∩B=∅</span>, <span class="math">|A∪B|=|A|+|B|</span>. En général, <span class="math">|A∪B|=|A|+|B|−|A∩B|</span>. Si <span class="math">|A|=p</span> et <span class="math">|B|=q</span>, alors <span class="math">|A×B|=pq</span> et <span class="math">|𝒫(A)|=2ᵖ</span>.</p>
 <p>Entre deux ensembles finis de même cardinal, une application injective est automatiquement surjective, et réciproquement. Ce résultat ne s'étend pas tel quel aux ensembles infinis : <span class="math">n↦n+1</span> est une injection de <span class="math">ℕ</span> dans lui-même qui n'est pas surjective si <span class="math">0∈ℕ</span>.</p>`]
]},
{
 id:"denombrement",title:"Dénombrement",icon:"02",
 subtitle:"Principe multiplicatif, arrangements, permutations, combinaisons.",
 blocks:[
 ["Reconnaître l'objet à compter",`
 <p>Commencer par décider si <strong>l'ordre compte</strong> et si <strong>les répétitions sont permises</strong>. Si une construction comporte <span class="math">r</span> étapes avec respectivement <span class="math">a₁,…,aᵣ</span> choix pour chaque branche, le nombre total est <span class="math">a₁···aᵣ</span>. Pour des cas <em>disjoints</em>, les effectifs s'additionnent.</p>
 <div class="grid"><div class="card"><strong>Ordre oui, répétition oui</strong><span class="formula">nᵏ</span>Listes de longueur k prises dans n symboles.</div><div class="card"><strong>Ordre oui, répétition non</strong><span class="formula">n!/(n−k)!</span>Arrangements de k éléments distincts parmi n.</div><div class="card"><strong>Ordre non, répétition non</strong><span class="formula">C(n,k)=n!/[k!(n−k)!]</span>Choix d'une partie à k éléments.</div></div>
 <p>Ces deux dernières formules exigent <span class="math">0≤k≤n</span>. Par convention <span class="math">0!=1</span>. Si tous les éléments sont rangés, il y a <span class="math">n!</span> permutations.</p>`],
 ["Preuves des formules",`
 <p>Un arrangement choisit successivement parmi <span class="math">n,n−1,…,n−k+1</span> possibilités. Donc <span class="math">A(n,k)=n!/(n−k)!</span>. Chaque partie à <span class="math">k</span> éléments apparaît dans les arrangements exactement <span class="math">k!</span> fois, ce qui démontre <span class="math">C(n,k)=A(n,k)/k!</span>.</p>
 <p>Si des lettres indistinguables apparaissent avec multiplicités <span class="math">m₁,…,mᵣ</span> et total <span class="math">n</span>, le nombre de mots différents est <span class="math">n!/(m₁!···mᵣ!)</span>. Cette formule suppose que les lettres de groupes différents sont distinctes.</p>`],
 ["Coefficients binomiaux",`
 <div class="formula">C(n,k)=C(n,n−k) ; &nbsp; C(n+1,k)=C(n,k)+C(n,k−1).</div>
 <p>La symétrie se prouve par complémentation. Pour Pascal, on fixe un élément : soit il appartient à la partie choisie, soit non. Avec <span class="math">C(n,k)=0</span> en dehors de <span class="math">0≤k≤n</span> :</p>
 <div class="formula">(a+b)ⁿ = Σ(k=0…n) C(n,k)aⁿ⁻ᵏbᵏ ; &nbsp; Σ(k=0…n)C(n,k)=2ⁿ.</div>
 <p>Cette dernière égalité compte aussi les parties d'un ensemble à <span class="math">n</span> éléments : chaque élément est inclus ou exclu.</p>`],
 ["Méthodes de dénombrement",`
 <p><strong>Par complémentaire :</strong> compter toutes les configurations puis enlever celles interdites. <strong>Par partition :</strong> couper en cas disjoints et exhaustifs. <strong>Par bijection :</strong> transformer les objets en un ensemble plus facile à compter. <strong>Double comptage :</strong> compter le même ensemble de couples de deux façons.</p>
 <p><strong>Tiroirs :</strong> répartir <span class="math">N</span> objets dans <span class="math">m≥1</span> boîtes force au moins une boîte à contenir <span class="math">⌈N/m⌉</span> objets. Si <span class="math">|E|=p</span> et <span class="math">|F|=q</span>, il existe <span class="math">qᵖ</span> applications <span class="math">E→F</span> ; pour <span class="math">p≤q</span>, <span class="math">q!/(q−p)!</span> sont injectives.</p>
 <div class="box warn"><strong>Question systématique :</strong> deux constructions différentes peuvent-elles aboutir au même objet final ? Si oui, identifier précisément leur multiplicité avant de diviser.</div>`]
]},
{
 id:"corps",title:"Structures algébriques et corps",icon:"03",
 subtitle:"Lois, groupes, anneaux, corps, inverses et exemples.",
 blocks:[
 ["Loi de composition interne",`
 <p>Une loi interne sur <span class="math">E</span> est une application <span class="math">⋆:E×E→E</span>. Elle peut être <em>associative</em>, <span class="math">(a⋆b)⋆c=a⋆(b⋆c)</span>, ou <em>commutative</em>, <span class="math">a⋆b=b⋆a</span>. Un <em>neutre</em> <span class="math">e</span> satisfait <span class="math">a⋆e=e⋆a=a</span>. S'il existe, il est unique.</p>
 <p>Un élément <span class="math">a</span> est inversible pour <span class="math">⋆</span> s'il existe <span class="math">b</span> avec <span class="math">a⋆b=b⋆a=e</span>. Dans un cadre associatif unitaire, son inverse est unique. Une partie <span class="math">F⊆E</span> est stable si <span class="math">a,b∈F⇒a⋆b∈F</span>.</p>`],
 ["Groupes et anneaux",`
 <p>Un <strong>groupe</strong> est un ensemble muni d'une loi associative avec neutre, où chaque élément possède un inverse. Il est <em>abélien</em> si sa loi est commutative. Exemples : <span class="math">(ℤ,+)</span>, <span class="math">(ℝ,+)</span>, <span class="math">(ℝ∖{0},×)</span>. Les entiers non nuls sous la multiplication ne forment pas un groupe : <span class="math">2</span> n'a pas d'inverse entier.</p>
 <p>Un <strong>anneau commutatif unitaire</strong> <span class="math">(A,+,×)</span> possède un groupe abélien pour <span class="math">+</span>, une multiplication associative et commutative de neutre <span class="math">1</span>, distributive sur <span class="math">+</span>. On suppose ici <span class="math">0≠1</span>. Exemples : <span class="math">ℤ</span> et <span class="math">ℝ[X]</span>. Dans <span class="math">ℤ</span>, seules <span class="math">−1</span> et <span class="math">1</span> sont inversibles pour la multiplication.</p>`],
 ["Définition et exemples de corps",`
 <p>Un <strong>corps commutatif</strong> <span class="math">K</span> est un anneau commutatif unitaire non nul dans lequel chaque élément non nul admet un inverse multiplicatif. De façon équivalente, <span class="math">(K,+)</span> et <span class="math">(K∖{0},×)</span> sont deux groupes abéliens, et la multiplication est distributive sur l'addition.</p>
 <div class="formula">ℚ, ℝ et ℂ sont des corps ; ℤ n'est pas un corps.</div>
 <p>Exemple fini simple : <span class="math">𝔽₂={0,1}</span> avec addition et multiplication modulo 2 ; <span class="math">1+1=0</span> et l'inverse multiplicatif de <span class="math">1</span> est <span class="math">1</span>. On ne peut pas, en revanche, diviser par zéro dans un corps.</p>
 <div class="box warn"><strong>Ne pas confondre :</strong> « fermé pour les deux opérations » et « être un corps ». Pour qu'un sous-ensemble de <span class="math">ℝ</span> soit un sous-corps, il lui faut notamment <span class="math">0,1</span>, les opposés et l'inverse de chaque élément non nul.</div>`],
 ["Conséquences des axiomes",`
 <p>Dans un corps : <span class="math">a·0=0</span> par distributivité et simplification additive ; <span class="math">(−a)b=−(ab)</span> ; <span class="math">(−a)(−b)=ab</span>. Si <span class="math">ab=0</span>, alors <span class="math">a=0</span> ou <span class="math">b=0</span> : si <span class="math">a≠0</span>, multiplier <span class="math">ab=0</span> par <span class="math">a⁻¹</span> donne <span class="math">b=0</span>.</p>
 <p>Pour <span class="math">a,b≠0</span>, <span class="math">(ab)⁻¹=b⁻¹a⁻¹</span> (donc <span class="math">a⁻¹b⁻¹</span> dans un corps commutatif). L'équation <span class="math">ax=b</span> admet alors l'unique solution <span class="math">x=a⁻¹b</span>.</p>`],
 ["Corps ordonné : passerelle vers les réels",`
 <p>Un corps ordonné est muni d'un ordre total compatible avec l'addition et la multiplication par un élément positif. Sur <span class="math">ℝ</span>, si <span class="math">a≤b</span>, alors <span class="math">a+c≤b+c</span> ; si <span class="math">c≥0</span>, <span class="math">ac≤bc</span>. Le cas <span class="math">c&lt;0</span> renverse le sens.</p>
 <p>Dans un corps ordonné, <span class="math">x²≥0</span> pour tout <span class="math">x</span> ; ainsi <span class="math">−1</span> ne peut pas être un carré. Le corps <span class="math">ℂ</span> ne peut pas être ordonné comme un corps : <span class="math">i²=−1</span>. <span class="math">ℚ</span> est ordonné mais n'a pas la propriété de la borne supérieure de <span class="math">ℝ</span>.</p>`]
]},
{
 id:"relations",title:"Relations d'ordre",icon:"04",
 subtitle:"Ordres partiels et totaux ; maximal, maximum et majorants.",
 blocks:[
 ["Définition d'un ordre",`
 <p>Une relation <span class="math">≼</span> sur <span class="math">E</span> est un ordre si elle est <strong>réflexive</strong> (<span class="math">x≼x</span>), <strong>antisymétrique</strong> (<span class="math">x≼y</span> et <span class="math">y≼x⇒x=y</span>) et <strong>transitive</strong> (<span class="math">x≼y≼z⇒x≼z</span>). Elle est <strong>totale</strong> lorsque deux éléments quelconques sont comparables.</p>
 <p>L'ordre usuel <span class="math">≤</span> sur <span class="math">ℝ</span> est total. L'inclusion <span class="math">⊆</span> sur <span class="math">𝒫(E)</span> est généralement partielle : <span class="math">{1}</span> et <span class="math">{2}</span> sont incomparables. La divisibilité sur <span class="math">ℕ*</span> est aussi un ordre partiel : ni <span class="math">2|3</span>, ni <span class="math">3|2</span>.</p>`],
 ["Plus grand élément ou élément maximal ?",`
 <p>Un <strong>plus grand élément</strong> <span class="math">g</span> d'une partie <span class="math">A</span> appartient à <span class="math">A</span> et satisfait <span class="math">x≼g</span> pour tout <span class="math">x∈A</span>. Il est nécessairement unique. Un élément <strong>maximal</strong> <span class="math">m</span> appartient à <span class="math">A</span> et aucun autre élément de <span class="math">A</span> n'est strictement supérieur à <span class="math">m</span>.</p>
 <p>Dans <span class="math">A={{1},{2}}</span> ordonné par inclusion, les deux éléments sont maximaux, sans plus grand élément. Dans un <em>ordre total</em>, un élément maximal est nécessairement un plus grand élément. Les notions de plus petit et minimal sont duales.</p>`],
 ["Majorants et bornes abstraites",`
 <p>Dans un ensemble ordonné <span class="math">E</span>, un majorant <span class="math">M</span> de <span class="math">A⊆E</span> vérifie <span class="math">x≼M</span> pour tout <span class="math">x∈A</span> ; il n'est pas obligé d'appartenir à <span class="math">A</span>. Un <em>maximum</em> est, lui, un majorant appartenant à <span class="math">A</span>. La borne supérieure, lorsqu'elle existe, est le plus petit des majorants.</p>
 <div class="box"><strong>Exemple du tableau :</strong> « majorant », « maximum », « plus grand élément » et « élément maximal » ne sont pas des synonymes dans un ordre partiel. Toujours préciser l'ensemble et la relation employés.</div>`]
]},
{
 id:"reels",title:"Réels et inégalités",icon:"05",
 subtitle:"Corps ordonné complet, intervalles, partie entière et bornes.",
 blocks:[
 ["Comparer les réels",`
 <p>Dans <span class="math">ℝ</span>, <span class="math">a≤b⇔b−a≥0</span>. L'ordre est total et compatible avec les opérations. On additionne deux inégalités de même sens ; on multiplie une inégalité par un réel positif en conservant le sens, par un réel négatif en le renversant.</p>
 <div class="formula">0&lt;a≤b ⇒ 0&lt;1/b≤1/a ; &nbsp; 0≤a≤b ⇒ a²≤b².</div>
 <p>Pour comparer des fractions, commencer par déterminer les signes des dénominateurs. Exemple : <span class="math">1/a≤1/b</span> pour <span class="math">0&lt;b≤a</span>. On ne met pas au carré une inégalité sans vérifier les signes : <span class="math">−3&lt;2</span> mais <span class="math">9&gt;4</span>.</p>`],
 ["Intervalles et propriété de la borne supérieure",`
 <p><span class="math">]a,b[={x:a&lt;x&lt;b}</span> ; <span class="math">[a,b]={x:a≤x≤b}</span>. Les crochets indiquent si les bornes sont incluses. Un ensemble <span class="math">A</span> est majoré si <span class="math">∃M∈ℝ,∀a∈A,a≤M</span> ; minoré de façon duale ; borné s'il est à la fois majoré et minoré.</p>
 <p>Une partie <em>non vide et majorée</em> de <span class="math">ℝ</span> possède une borne supérieure <span class="math">s=sup A</span>. Pour le reconnaître : <span class="math">s</span> est majorant, puis pour tout <span class="math">ε&gt;0</span>, il existe <span class="math">a∈A</span> tel que <span class="math">s−ε&lt;a≤s</span>. Pour <span class="math">]0,1[</span>, <span class="math">sup=1</span> et <span class="math">inf=0</span>, sans maximum ni minimum.</p>
 <p>Une partie non vide et minorée possède une borne inférieure. Cette propriété distingue <span class="math">ℝ</span> de <span class="math">ℚ</span> : l'ensemble des rationnels positifs dont le carré est inférieur à 2 est majoré dans <span class="math">ℚ</span>, mais n'y possède pas de borne supérieure rationnelle.</p>`],
 ["Archimède, densité et partie entière",`
 <p><strong>Archimède :</strong> pour tout <span class="math">x∈ℝ</span>, il existe un entier naturel <span class="math">n&gt;x</span>. Conséquence : pour <span class="math">ε&gt;0</span>, on peut trouver <span class="math">n</span> avec <span class="math">1/n&lt;ε</span>.</p>
 <p>Tout réel <span class="math">x</span> possède une unique partie entière <span class="math">⌊x⌋∈ℤ</span> telle que <span class="math">⌊x⌋≤x&lt;⌊x⌋+1</span>. Attention : <span class="math">⌊−1,2⌋=−2</span>.</p>
 <p><strong>Densité de ℚ dans ℝ :</strong> si <span class="math">a&lt;b</span>, il existe un rationnel <span class="math">r</span> vérifiant <span class="math">a&lt;r&lt;b</span>. Preuve-type : choisir <span class="math">n∈ℕ*</span> tel que <span class="math">n(b−a)&gt;1</span> puis un entier <span class="math">m</span> avec <span class="math">na&lt;m&lt;nb</span>. On peut prendre <span class="math">m=⌊na⌋+1</span> : <span class="math">m&gt;na</span> et <span class="math">m≤na+1&lt;nb</span>. Alors <span class="math">r=m/n</span> convient.</p>`],
 ["Encadrements et arguments ε",`
 <p>Si <span class="math">x≤y+ε</span> pour tout <span class="math">ε&gt;0</span>, alors <span class="math">x≤y</span> : sinon, prendre <span class="math">ε=(x−y)/2</span>. En revanche <span class="math">x&lt;y+ε</span> pour tout <span class="math">ε&gt;0</span> ne permet pas d'affirmer <span class="math">x&lt;y</span>.</p>
 <div class="box warn"><strong>Rédaction :</strong> « on passe à la limite » doit toujours être précédé d'une convergence établie et d'une opération autorisée.</div>`]
]},
{
 id:"valeur",title:"Valeur absolue et distance",icon:"06",
 subtitle:"Définitions, équations, inéquations et inégalités triangulaires.",
 blocks:[
 ["Définition et propriétés",`
 <div class="formula">|x|=max(x,−x)=x si x≥0 ; |x|=−x si x&lt;0.</div>
 <p><span class="math">|x|≥0</span>, avec égalité si et seulement si <span class="math">x=0</span> ; <span class="math">|−x|=|x|</span> ; <span class="math">|xy|=|x||y|</span> ; pour <span class="math">y≠0</span>, <span class="math">|x/y|=|x|/|y|</span>. De plus, <span class="math">|x|²=x²</span>.</p>
 <p>La distance de <span class="math">x</span> à <span class="math">a</span> sur la droite est <span class="math">|x−a|</span>. Ainsi <span class="math">|x−a|&lt;r</span>, pour <span class="math">r&gt;0</span>, décrit l'intervalle <span class="math">]a−r,a+r[</span>.</p>`],
 ["Équations et inéquations",`
 <p>Pour <span class="math">r&gt;0</span> :</p>
 <div class="formula">|x−a|=r ⇔ x=a−r ou x=a+r.</div>
 <div class="formula">|x−a|≤r ⇔ a−r≤x≤a+r.</div>
 <div class="formula">|x−a|≥r ⇔ x≤a−r ou x≥a+r.</div>
 <p>Si <span class="math">r=0</span>, <span class="math">|x−a|≤0⇔x=a</span> et <span class="math">|x−a|≥0</span> est toujours vraie. Si <span class="math">r&lt;0</span>, <span class="math">|x−a|≤r</span> n'a aucune solution et <span class="math">|x−a|≥r</span> est toujours vraie. Pour plusieurs valeurs absolues, découper la droite aux zéros des expressions intérieures, résoudre dans chaque intervalle et <em>vérifier</em> les candidats.</p>`],
 ["Inégalité triangulaire et variante inverse",`
 <div class="formula">|x+y|≤|x|+|y| ; &nbsp; ||x|−|y||≤|x−y|.</div>
 <p>Preuve de la première : additionner <span class="math">−|x|≤x≤|x|</span> et <span class="math">−|y|≤y≤|y|</span>. Pour la seconde, <span class="math">|x|=|(x−y)+y|≤|x−y|+|y|</span> ; inverser les rôles de <span class="math">x</span> et <span class="math">y</span>.</p>
 <p>Version géométrique : <span class="math">|x−z|≤|x−y|+|y−z|</span>. Elle sert à majorer une distance compliquée par la somme de deux distances accessibles.</p>
 <div class="box warn"><strong>Attention :</strong> <span class="math">|x+y|=|x|+|y|</span> seulement dans certains cas, notamment lorsque <span class="math">x</span> et <span class="math">y</span> ont le même signe ou si l'un est nul.</div>`]
]},
{
 id:"suites",title:"Suites numériques",icon:"07",
 subtitle:"Définition, sommes, récurrence, monotonie et bornes.",
 blocks:[
 ["Définir une suite",`
 <p>Une suite réelle est une application des entiers à partir d'un rang <span class="math">n₀</span> dans <span class="math">ℝ</span>. Une formule <em>explicite</em> donne directement <span class="math">uₙ</span> ; une <em>récurrence</em> donne les premiers termes et une règle pour les suivants. Une définition par <span class="math">uₙ₊₁=f(uₙ)</span> exige que chaque terme reste dans le domaine de <span class="math">f</span>.</p>
 <p>Pour comparer deux suites à partir d'un certain rang, vérifier que le rang initial peut être ignoré pour l'étude d'une limite, mais pas pour l'affirmation « croissante sur tout son domaine ».</p>`],
 ["Suites arithmétiques et géométriques",`
 <p>Si <span class="math">uₙ₊₁=uₙ+r</span>, alors <span class="math">uₙ=uₚ+(n−p)r</span> pour <span class="math">n≥p</span>. La somme de termes consécutifs vaut <span class="math">(nombre de termes)×(premier+dernier)/2</span>.</p>
 <p>Si <span class="math">uₙ₊₁=quₙ</span>, alors <span class="math">uₙ=uₚqⁿ⁻ᵖ</span>. Pour <span class="math">q≠1</span> :</p>
 <div class="formula">1+q+⋯+qⁿ=(1−qⁿ⁺¹)/(1−q).</div>
 <p>Si <span class="math">q=1</span>, cette somme vaut <span class="math">n+1</span>. Pour <span class="math">|q|&lt;1</span>, <span class="math">qⁿ→0</span>. Attention aux raisons négatives : la suite peut osciller.</p>`],
 ["Variations et bornes",`
 <p>Une suite est croissante si <span class="math">uₙ₊₁≥uₙ</span> à tout rang considéré. Étudier le signe de <span class="math">uₙ₊₁−uₙ</span>. Si <span class="math">uₙ&gt;0</span>, comparer aussi <span class="math">uₙ₊₁/uₙ</span> à 1. Si <span class="math">uₙ=f(n)</span>, une étude des variations de <span class="math">f</span> peut suffire.</p>
 <p>Une suite est majorée s'il existe <span class="math">M</span> tel que <span class="math">uₙ≤M</span> pour tout rang. Elle est minorée de façon analogue ; bornée si <span class="math">|uₙ|≤M</span> pour un certain <span class="math">M≥0</span>. Pour une récurrence, établir d'abord par récurrence un <em>intervalle stable</em> <span class="math">I</span> tel que <span class="math">u₀∈I</span> et <span class="math">f(I)⊆I</span>.</p>`],
 ["Étude d'une récurrence affine",`
 <p>Soit <span class="math">uₙ₊₁=auₙ+b</span> avec <span class="math">a≠1</span>. Le point fixe est <span class="math">ℓ=b/(1−a)</span>. Poser <span class="math">vₙ=uₙ−ℓ</span> : alors <span class="math">vₙ₊₁=avₙ</span> et <span class="math">uₙ=ℓ+aⁿ(u₀−ℓ)</span>.</p>
 <p>On peut conclure directement : si <span class="math">|a|&lt;1</span>, <span class="math">uₙ→ℓ</span>. Si <span class="math">a=1</span>, on retrouve la suite arithmétique <span class="math">uₙ=u₀+nb</span>. Les autres cas dépendent de <span class="math">a</span> et du terme initial : ne pas annoncer une limite sans les analyser.</p>`]
]},
{
 id:"limites",title:"Limites de suites",icon:"08",
 subtitle:"Définitions ε, opérations, comparaison, gendarmes, suites extraites.",
 blocks:[
 ["Définitions",`
 <p><span class="math">uₙ→ℓ∈ℝ</span> si <span class="math">∀ε&gt;0,∃N∈ℕ,∀n≥N, |uₙ−ℓ|&lt;ε</span>. La limite, si elle existe, est unique ; la suite est dite convergente. Les premiers termes n'influencent pas la limite.</p>
 <p><span class="math">uₙ→+∞</span> si <span class="math">∀A∈ℝ,∃N,∀n≥N,uₙ&gt;A</span> ; définition symétrique pour <span class="math">−∞</span>. Tendre vers l'infini n'est pas « converger vers un réel ». Toute suite convergente est bornée ; <span class="math">(−1)ⁿ</span> montre que la réciproque est fausse.</p>`],
 ["Opérations et formes indéterminées",`
 <p>Si <span class="math">uₙ→a</span> et <span class="math">vₙ→b</span>, alors somme et produit tendent respectivement vers <span class="math">a+b</span> et <span class="math">ab</span>. Pour le quotient, il faut <span class="math">b≠0</span>, ce qui garantit un dénominateur non nul à partir d'un certain rang. Des expressions telles que <span class="math">0/0</span>, <span class="math">∞/∞</span>, <span class="math">0×∞</span> ou <span class="math">∞−∞</span> requièrent une transformation préalable.</p>
 <p>Pour un quotient de polynômes en <span class="math">n</span>, factoriser par la plus grande puissance de <span class="math">n</span> pertinente. Exemple : <span class="math">(3n²+n)/(n²+2)=(3+1/n)/(1+2/n²)→3</span>.</p>`],
 ["Comparaison et gendarmes",`
 <p>Si <span class="math">uₙ≤vₙ</span> à partir d'un certain rang et si les deux suites convergent, leurs limites vérifient <span class="math">lim uₙ≤lim vₙ</span> : la stricte inégalité n'est pas forcément conservée.</p>
 <div class="formula">aₙ≤uₙ≤bₙ et aₙ,bₙ→ℓ ⇒ uₙ→ℓ.</div>
 <p>C'est le théorème des gendarmes. Si <span class="math">|uₙ−ℓ|≤wₙ</span> et <span class="math">wₙ≥0→0</span>, il s'applique immédiatement. Si <span class="math">uₙ≥vₙ</span> à partir d'un rang et <span class="math">vₙ→+∞</span>, alors <span class="math">uₙ→+∞</span>.</p>`],
 ["Suites extraites et limites usuelles",`
 <p>Si <span class="math">uₙ→ℓ</span>, toute suite extraite <span class="math">uφ(n)</span>, avec <span class="math">φ(n)→∞</span>, tend vers <span class="math">ℓ</span>. Si <span class="math">u₂ₙ</span> et <span class="math">u₂ₙ₊₁</span> tendent vers deux limites différentes, <span class="math">uₙ</span> diverge.</p>
 <div class="formula">1/nᵅ→0 (α&gt;0) ; &nbsp; qⁿ→0 si |q|&lt;1 ; &nbsp; qⁿ→+∞ si q&gt;1.</div>
 <p>Pour <span class="math">q=−1</span>, la suite alterne entre 1 et −1. Pour <span class="math">q&lt;−1</span>, les sous-suites paires et impaires s'éloignent dans des sens opposés.</p>`],
 ["Définition ε : une preuve modèle",`
 <p>Montrons <span class="math">1/n→0</span> pour <span class="math">n≥1</span>. Soit <span class="math">ε&gt;0</span>. Par Archimède, choisir un entier <span class="math">N&gt;1/ε</span>. Pour <span class="math">n≥N</span>, <span class="math">0≤1/n≤1/N&lt;ε</span>. On a donc <span class="math">|1/n−0|&lt;ε</span>, ce qui est exactement la définition.</p>`]
]},
{
 id:"convergence",title:"Théorèmes de convergence",icon:"09",
 subtitle:"Monotonie, adjacence, point fixe, Cauchy et stratégie de preuve.",
 blocks:[
 ["Convergence monotone",`
 <p>Une suite croissante et majorée de réels converge vers la borne supérieure de l'ensemble de ses termes. Une suite décroissante et minorée converge vers leur borne inférieure. Preuve dans le cas croissant : si <span class="math">ℓ=sup{uₙ}</span>, pour tout <span class="math">ε&gt;0</span>, il existe <span class="math">N</span> tel que <span class="math">ℓ−ε&lt;u_N≤ℓ</span>. Pour <span class="math">n≥N</span>, la croissance donne <span class="math">ℓ−ε&lt;uₙ≤ℓ</span>, d'où la convergence.</p>
 <p>Une suite croissante <em>non majorée</em> tend vers <span class="math">+∞</span>. Le lien entre monotonie et complétude de <span class="math">ℝ</span> est essentiel : on ne peut pas remplacer gratuitement <span class="math">ℝ</span> par <span class="math">ℚ</span>.</p>`],
 ["Suites adjacentes",`
 <p>Deux suites <span class="math">(aₙ)</span> et <span class="math">(bₙ)</span> sont adjacentes lorsque <span class="math">aₙ</span> croît, <span class="math">bₙ</span> décroît et <span class="math">bₙ−aₙ→0</span>. La différence est alors décroissante et de limite 0, donc elle reste positive ou nulle. Les deux suites sont bornées, convergent et possèdent la même limite.</p>
 <p>Cette méthode fournit aussi une <strong>approximation encadrée</strong> : <span class="math">aₙ≤ℓ≤bₙ</span>, avec erreur inférieure ou égale à <span class="math">bₙ−aₙ</span>.</p>`],
 ["Récurrence et point fixe",`
 <p>Pour <span class="math">uₙ₊₁=f(uₙ)</span>, chercher un domaine stable, prouver la convergence (souvent par monotonie et borne), puis utiliser la continuité de <span class="math">f</span> au point limite <span class="math">ℓ</span> pour obtenir <span class="math">ℓ=f(ℓ)</span>. Résoudre cette dernière équation <em>avant</em> la preuve de convergence fournit seulement des candidats.</p>
 <p>Autre stratégie : si, sur un domaine stable, <span class="math">|f(x)−f(y)|≤q|x−y|</span> avec <span class="math">0≤q&lt;1</span> et un point fixe <span class="math">ℓ</span> connu, alors <span class="math">|uₙ−ℓ|≤qⁿ|u₀−ℓ|→0</span>. La conclusion ne requiert pas de monotonie.</p>`],
 ["Complément : critère de Cauchy",`
 <p>Une suite réelle est de Cauchy si <span class="math">∀ε&gt;0,∃N,∀p,n≥N,|uₚ−uₙ|&lt;ε</span>. Toute suite convergente est de Cauchy par l'inégalité triangulaire ; dans <span class="math">ℝ</span>, la réciproque est vraie grâce à la complétude. On peut donc prouver une convergence <em>sans connaître d'abord la limite</em>.</p>
 <div class="box warn"><strong>Niveau :</strong> ce dernier critère est un approfondissement de première année ; on peut d'abord maîtriser gendarmes, monotonie et suites adjacentes.</div>`]
]}
];

["logique","Définir injectivité, surjectivité et bijectivité.","Injective : mêmes images ⇒ mêmes antécédents. Surjective : tout élément du but a au moins un antécédent. Bijective : les deux ; tout élément du but a exactement un antécédent."],

["denombrement","Énoncer le principe multiplicatif.","Si toute construction comporte successivement a₁,…,aᵣ choix à chacune des étapes, le nombre total est leur produit. Si le nombre de choix dépend des étapes précédentes, le vérifier branche par branche."],

["corps","Pourquoi ℂ n'est-il pas un corps ordonné ?","Dans tout corps ordonné, tout carré est positif ou nul. Dans ℂ, i²=−1, contradiction si l'ordre était compatible avec les lois."],

["relations","Maximal et plus grand : quelle différence ?","Plus grand = supérieur à tous les éléments ; maximal = aucun élément distinct ne lui est strictement supérieur. Dans un ordre partiel, plusieurs maximaux peuvent coexister sans plus grand."],
["relations","Définir un majorant.","Un majorant M d'une partie A d'un ensemble ordonné E satisfait ∀a∈A, a≼M ; M appartient à E, pas nécessairement à A."],
["reels","Définir la borne supérieure d'un ensemble de réels.","Pour A non vide majoré, sup A est le plus petit des majorants : c'est un majorant s tel que tout t<s échoue à majorer A."],
["reels","Énoncer la propriété d'Archimède.","Pour tout réel x, il existe n∈ℕ tel que n>x ; en particulier, pour ε>0, on peut rendre 1/n inférieur à ε."],
["reels","Pourquoi faut-il vérifier le signe en multipliant une inégalité ?","Si c>0 le sens reste le même ; si c<0 il s'inverse ; si c=0 les deux membres deviennent égaux et on ne peut en général récupérer l'inégalité initiale."],
["valeur","Définir |x| et donner son interprétation.","|x|=max(x,−x), donc x si x≥0 et −x sinon. |x−a| est la distance entre x et a."],
["valeur","Énoncer et prouver brièvement l'inégalité triangulaire.","|x+y|≤|x|+|y| : additionner −|x|≤x≤|x| et −|y|≤y≤|y|."],
["valeur","Que vaut ||x|−|y|| au plus ?","||x|−|y||≤|x−y|. Utiliser |x|≤|x−y|+|y| et son analogue en échangeant x et y."],
["suites","Donner le terme général d'une suite arithmétique.","Si uₙ₊₁=uₙ+r, alors uₙ=uₚ+(n−p)r pour n≥p."],
["suites","Donner la somme d'une progression géométrique.","Pour q≠1, 1+q+⋯+qⁿ=(1−qⁿ⁺¹)/(1−q) ; si q=1, cette somme vaut n+1."],
["suites","Comment prouver qu'un intervalle est stable par récurrence ?","Vérifier u₀∈I, puis f(I)⊆I pour uₙ₊₁=f(uₙ). L'induction entraîne uₙ∈I pour tout n."],
["limites","Énoncer la définition ε d'une limite finie.","uₙ→ℓ si ∀ε>0, ∃N∈ℕ, ∀n≥N, |uₙ−ℓ|<ε."],
["limites","Énoncer le théorème des gendarmes.","Si aₙ≤uₙ≤bₙ à partir d'un rang et si aₙ,bₙ→ℓ, alors uₙ→ℓ."],
["limites","Une inégalité stricte passe-t-elle strictement à la limite ?","Non : 0<1/n pour n≥1, mais les limites des deux membres valent 0."],
["limites","Comment prouver une divergence avec deux suites extraites ?","Si deux sous-suites convergent vers des limites distinctes, la suite de départ ne converge pas : toute sous-suite d'une suite convergente aurait la même limite."],

{

a:"Compter les couples (A,x) où A⊆E et x∈A, |E|=n. Pour |A|=k : C(n,k) choix de A, puis k choix de x ; cela donne le membre gauche. Sinon choisir x de n façons, puis choisir librement A∖{x} parmi n−1 éléments : 2ⁿ⁻¹ possibilités. D'où l'identité."

{

{
c:"corps",level:2,title:"Sous-corps de ℝ",

{

{

{

{

{

{

q:"Cours : définir un supremum. Exercice : A={1−1/n:n≥1}. Déterminer inf, sup, min et max.",

{

},
{
c:"reels",level:3,title:"Densité des rationnels",
q:"Cours : énoncer la propriété d'Archimède. Exercice : si a<b, construire un rationnel entre a et b.",
a:"Prendre n∈ℕ* tel que n(b−a)>1. Poser m=⌊na⌋+1. On a na<m≤na+1<nb. Ainsi a<m/n<b et m/n∈ℚ. Le choix de n et les deux inégalités sont indispensables."
},
{
c:"valeur",level:1,title:"Deux inéquations",
q:"Cours : interpréter |x−a|. Exercice : résoudre |2x−3|≤5 et |x−1|>2.",
a:"−5≤2x−3≤5 donne −2≤2x≤8, donc −1≤x≤4. Par ailleurs |x−1|>2 équivaut à x−1<−2 ou x−1>2, soit x<−1 ou x>3."

{
c:"valeur",level:2,title:"Somme de distances",
q:"Cours : rappeler l'inégalité triangulaire. Exercice : résoudre |x−1|+|x+1|=4.",
a:"Couper en −1 et 1. Si x≤−1, la somme vaut −2x, d'où x=−2. Si −1≤x≤1, elle vaut 2 : aucune solution. Si x≥1, elle vaut 2x, d'où x=2. Les deux candidats appartiennent à leurs intervalles : solutions {−2,2}."
},
{
c:"valeur",level:2,title:"Inégalité triangulaire inverse",
q:"Cours : prouver ||x|−|y||≤|x−y|. Exercice : majorer ||uₙ|−|ℓ|| si |uₙ−ℓ|≤1/n.",
a:"|x|≤|x−y|+|y| donne |x|−|y|≤|x−y|. En échangeant x,y, on obtient l'autre sens. Avec x=uₙ,y=ℓ : 0≤||uₙ|−|ℓ||≤|uₙ−ℓ|≤1/n ; donc |uₙ|→|ℓ|."
},
{
c:"valeur",level:3,title:"Inéquation par intervalles",
q:"Cours : méthode des changements de signe. Exercice : résoudre |x−2|+|x+1|≤5.",
a:"Pour x≤−1, la somme vaut 1−2x ; l'inégalité impose x≥−2, donc [−2,−1]. Pour −1≤x≤2, elle vaut 3 : tout l'intervalle convient. Pour x≥2, elle vaut 2x−1 ; 2x−1≤5 donne x≤3, donc [2,3]. Réunion : [−2,3]."
},
{
c:"suites",level:1,title:"Une suite arithmétique",
q:"Cours : terme général et somme d'une suite arithmétique. Exercice : u₀=5, uₙ₊₁=uₙ−2 ; trouver uₙ et Σ(k=0…n)uₖ.",
a:"La raison est −2, donc uₙ=5−2n. Il y a n+1 termes, premier 5, dernier 5−2n. La somme vaut (n+1)(10−2n)/2=(n+1)(5−n)."

{
c:"suites",level:1,title:"Une suite géométrique",
q:"Cours : formule de somme. Exercice : Σ(k=0…n)(1/3)ᵏ et sa limite.",
a:"Pour q=1/3≠1, Sₙ=(1−(1/3)ⁿ⁺¹)/(1−1/3)=(3/2)(1−3⁻⁽ⁿ⁺¹⁾). Puisque 3⁻⁽ⁿ⁺¹⁾→0, Sₙ→3/2."

{

a:"uₙ₊₁−uₙ=(n+1)/(n+2)−n/(n+1)=1/[(n+1)(n+2)]>0. Donc la suite croît strictement. 0≤uₙ<1 et uₙ=1−1/(n+1)→1."
},
{
c:"suites",level:3,title:"Récurrence affine",

{

q:"Cours : définir uₙ→0. Exercice : montrer directement que 2/(n+1)→0.",

q:"Cours : énoncer les gendarmes. Exercice : limite de uₙ=(−1)ⁿn/(n²+1).",

{

a:"Pour n≥1, u₂ₙ=1+1/(2n)→1 et u₂ₙ₊₁=−1+1/(2n+1)→−1. Les deux sous-suites ont des limites distinctes : la suite initiale ne converge pas."

{

q:"Cours : citer une forme indéterminée. Exercice : limite de (3n²−2n)/(5n²+n+1).",
a:"La forme initiale ∞/∞ ne conclut rien. Pour n≥1, diviser numérateur et dénominateur par n² : (3−2/n)/(5+1/n+1/n²). Les petits termes tendent vers 0 et le dénominateur limite vaut 5≠0 : la limite est 3/5."
},
{
c:"convergence",level:2,title:"Suite monotone",
q:"Cours : théorème de convergence monotone. Exercice : uₙ=Σ(k=1…n)1/[k(k+1)] ; prouver la convergence et trouver la limite.",
a:"Chaque nouveau terme 1/[(n+1)(n+2)] est positif : uₙ croît. Or 1/[k(k+1)]=1/k−1/(k+1), donc la somme télescopique vaut uₙ=1−1/(n+1)<1. Elle est croissante et majorée, donc converge ; la formule donne la limite 1."

{

a:"aₙ croît car 1/n décroît ; bₙ décroît. bₙ−aₙ=2/n→0. Elles sont adjacentes et leur limite commune est 1. De plus aₙ≤1≤bₙ et l'écart vaut 2/n."

a:"[0,2] est stable : si 0≤uₙ≤2, alors 0≤√(2+uₙ)≤2. La fonction x↦√(2+x) est croissante ; u₁≥u₀ entraîne par récurrence uₙ₊₁≥uₙ. La suite converge donc vers ℓ∈[0,2]. Par continuité, ℓ=√(2+ℓ). En élevant au carré, (ℓ−2)(ℓ+1)=0 ; ℓ≥0 impose ℓ=2."

{

}

const ds=[
{
c:"logique",level:1,title:"DS 01 — Ensembles et applications",
q:`<ol><li>Montrer A∩(B∪C)=(A∩B)∪(A∩C).</li><li>Si f:E→F, prouver f⁻¹(B∩C)=f⁻¹(B)∩f⁻¹(C).</li><li>Si E et F sont finis de même cardinal et f:E→F injective, conclure.</li></ol>`,
a:`<ol><li>Pour x quelconque, x appartient au membre gauche ssi x∈A et (x∈B ou x∈C), ssi (x∈A∩B ou x∈A∩C). Les appartenances sont équivalentes.</li><li>x∈f⁻¹(B∩C) ssi f(x)∈B et f(x)∈C, ssi x appartient aux deux images réciproques. La bijectivité de f est inutile.</li><li>Les images d'éléments distincts sont distinctes ; puisqu'il y a autant d'éléments au départ et à l'arrivée, ces images remplissent F. f est surjective et donc bijective.</li></ol>`
},
{
c:"denombrement",level:2,title:"DS 02 — Permutations contraintes",
q:`<ol><li>Combien d'anagrammes distinctes du mot BANANE ?</li><li>Combien commencent par B ?</li><li>Combien commencent et finissent par A ?</li></ol>`,
a:`<ol><li>Six lettres avec A deux fois, N deux fois, B et E une fois : 6!/(2!2!)=180.</li><li>B fixé : placer les cinq lettres A,A,N,N,E, soit 5!/(2!2!)=30.</li><li>Les deux A occupent les extrémités ; placer B,N,N,E aux quatre places du milieu : 4!/2!=12. Les deux A identiques ne créent aucun facteur 2.</li></ol>`
},
{
c:"denombrement",level:3,title:"DS 03 — Décompte par deux chemins",
q:`<ol><li>Dans un ensemble E de n≥2 éléments, compter les couples (A,x) tels que A⊆E et x∈A.</li><li>En déduire Σ(k=0…n)kC(n,k)=n2ⁿ⁻¹.</li><li>Compter les couples (A,{x,y}) où {x,y}⊆A et x≠y, puis déduire Σ(k=0…n)C(k,2)C(n,k)=C(n,2)2ⁿ⁻².</li></ol>`,
a:`<ol><li>Choisir x de n façons, puis la présence/absence des n−1 autres éléments dans A : n2ⁿ⁻¹ couples.</li><li>Si |A|=k, choisir A de C(n,k) façons puis x de k façons. En sommant selon k, on obtient l'identité.</li><li>Choisir d'abord la partie à deux éléments {x,y} parmi E : C(n,2) choix. Les n−2 éléments restants peuvent librement appartenir à A : 2ⁿ⁻² choix. Par taille k de A, on a C(n,k)C(k,2) choix. Égaliser les deux résultats.</li></ol>`
},
{
c:"corps",level:2,title:"DS 04 — Corps et inverses",
q:`<ol><li>Rappeler pourquoi ℚ est un corps mais ℤ n'en est pas un.</li><li>Prouver que si a,b sont non nuls dans un corps commutatif, (ab)⁻¹=a⁻¹b⁻¹.</li><li>Résoudre (2+√3)x=1 dans ℚ(√3).</li></ol>`,
a:`<ol><li>Chaque rationnel non nul p/q a l'inverse q/p, alors que 2 ne possède pas d'inverse entier.</li><li>Par associativité et commutativité, (ab)(a⁻¹b⁻¹)=(aa⁻¹)(bb⁻¹)=1. Un inverse étant unique, c'est bien celui de ab.</li><li>(2+√3)(2−√3)=1. Le coefficient est non nul et son inverse vaut 2−√3 ; l'unique solution est donc x=2−√3, élément de ℚ(√3).</li></ol>`
},
{
c:"relations",level:2,title:"DS 05 — Un ordre non total",
q:`<ol><li>Montrer que ⊆ définit un ordre sur 𝒫({1,2,3}).</li><li>Pour A={{1},{2}}, déterminer les éléments maximaux et l'éventuel plus grand élément.</li><li>Dans 𝒫({1,2,3}), déterminer tous les majorants de A et sa borne supérieure.</li></ol>`,
a:`<ol><li>Chaque partie est incluse en elle-même. Deux inclusions réciproques donnent l'égalité. La composition de deux inclusions donne l'inclusion : réflexivité, antisymétrie, transitivité.</li><li>Dans A, ni {1} ni {2} n'est strictement au-dessous de l'autre : les deux sont maximaux. Aucun n'inclut l'autre : pas de plus grand élément.</li><li>Un majorant doit contenir à la fois 1 et 2 : ce sont {1,2} et {1,2,3}. Le plus petit est {1,2}, donc sup A={1,2} dans l'ordre par inclusion.</li></ol>`
},
{
c:"reels",level:3,title:"DS 06 — Bornes et approximation",
q:`<ol><li>Pour A={n/(n+1):n∈ℕ}, prouver que 1 est un majorant.</li><li>Prouver qu'aucun s&lt;1 n'est majorant ; préciser sup, inf, max et min.</li><li>En déduire que 1/n→0 par un encadrement approprié.</li></ol>`,
a:`<ol><li>n/(n+1)=1−1/(n+1)&lt;1 puisque n+1&gt;0.</li><li>Pour ε=1−s&gt;0, choisir n tel que 1/(n+1)&lt;ε : alors n/(n+1)&gt;s. Un tel n existe par Archimède. Donc sup A=1, non atteint. Le premier terme est 0 et la suite croît : inf A=min A=0, pas de maximum.</li><li>Pour n≥1, 1/n≥0 et, pour tout ε&gt;0, Archimède donne N&gt;1/ε ; si n≥N, 1/n≤1/N&lt;ε. Donc 1/n→0.</li></ol>`
},
{
c:"valeur",level:2,title:"DS 07 — Distance et intervalles",
q:`<ol><li>Résoudre |2x−1|&lt;3 et donner la borne supérieure de l'ensemble des solutions.</li><li>Résoudre |x−2|+|x+1|=5.</li><li>Montrer ||x|−|y||≤|x−y| et l'utiliser pour prouver que uₙ→ℓ implique |uₙ|→|ℓ|.</li></ol>`,
a:`<ol><li>−3&lt;2x−1&lt;3 ⇔ −1&lt;x&lt;2. Supremum : 2, non atteint.</li><li>Si x≤−1, la somme vaut 1−2x : x=−2. Si −1≤x≤2, elle vaut 3 : impossible. Si x≥2, elle vaut 2x−1 : x=3. Solutions {−2,3}.</li><li>L'inégalité triangulaire donne |x|−|y|≤|x−y|, puis l'inégalité symétrique en échangeant x et y. Donc ||uₙ|−|ℓ||≤|uₙ−ℓ|→0 ; les gendarmes concluent.</li></ol>`
},
{
c:"suites",level:2,title:"DS 08 — Géométrique et affine",
q:`<ol><li>Calculer Sₙ=Σ(k=0…n)(2/3)ᵏ et sa limite.</li><li>Si u₀=4 et uₙ₊₁=(2uₙ+3)/5, déterminer le point fixe ℓ.</li><li>Donner uₙ, son sens de variation et sa limite.</li></ol>`,
a:`<ol><li>Sₙ=(1−(2/3)ⁿ⁺¹)/(1−2/3)=3(1−(2/3)ⁿ⁺¹), donc Sₙ→3.</li><li>ℓ=(2ℓ+3)/5, soit 3ℓ=3 et ℓ=1.</li><li>vₙ=uₙ−1 vérifie vₙ₊₁=(2/5)vₙ, v₀=3. Ainsi uₙ=1+3(2/5)ⁿ, strictement décroissante puisque 0&lt;2/5&lt;1, minorée par 1 et convergeant vers 1.</li></ol>`
},
{
c:"limites",level:2,title:"DS 09 — Oscillation et gendarmes",
q:`<ol><li>Montrer que vₙ=(−1)ⁿ ne converge pas.</li><li>Étudier uₙ=(−1)ⁿ/(n+1).</li><li>Déterminer la limite de wₙ=(3n²+(-1)ⁿn)/(2n²+1).</li></ol>`,
a:`<ol><li>Les termes pairs sont égaux à 1 et les termes impairs à −1 ; ces sous-suites ont des limites différentes.</li><li>|uₙ|=1/(n+1)→0. Ainsi −1/(n+1)≤uₙ≤1/(n+1), donc uₙ→0.</li><li>Diviser par n², pour n≥1 : wₙ=[3+(-1)ⁿ/n]/[2+1/n²]. Le terme oscillant divisé par n tend vers 0 par encadrement, le dénominateur vers 2≠0. Donc wₙ→3/2.</li></ol>`
},
{
c:"convergence",level:3,title:"DS 10 — Suite récurrente non linéaire",
q:`<ol><li>u₀=1, uₙ₊₁=√(2+uₙ). Prouver 1≤uₙ≤2.</li><li>Prouver que la suite est croissante.</li><li>Calculer sa limite sans la présupposer.</li></ol>`,
a:`<ol><li>u₀∈[1,2]. Si uₙ∈[1,2], alors √(2+uₙ)∈[√3,2]⊆[1,2]. La propriété vaut par récurrence.</li><li>u₁=√3≥u₀. La fonction f(x)=√(2+x) est croissante sur [1,2]. Si uₙ₊₁≥uₙ, alors uₙ₊₂=f(uₙ₊₁)≥f(uₙ)=uₙ₊₁. La suite est croissante.</li><li>Croissante et majorée, elle converge vers ℓ∈[1,2]. Par continuité, ℓ=√(2+ℓ), donc (ℓ−2)(ℓ+1)=0 ; seul ℓ=2 appartient à [1,2].</li></ol>`
},
{
c:"convergence",level:3,title:"DS 11 — Adjacence et encadrements",
q:`<ol><li>Pour n≥1, définir aₙ=Σ(k=1…n)1/k² et bₙ=aₙ+1/n. Étudier la variation de a.</li><li>Calculer bₙ₊₁−bₙ et en déduire que b décroît.</li><li>Conclure quant aux limites et majorer l'erreur bₙ−aₙ.</li></ol>`,
a:`<ol><li>aₙ₊₁−aₙ=1/(n+1)²&gt;0 : a croît.</li><li>bₙ₊₁−bₙ=1/(n+1)²+1/(n+1)−1/n=1/(n+1)²−1/[n(n+1)]=−1/[n(n+1)²]&lt;0.</li><li>bₙ−aₙ=1/n→0. Les suites sont adjacentes : elles convergent vers une limite commune ℓ, avec aₙ≤ℓ≤bₙ. Ainsi 0≤ℓ−aₙ≤1/n. Il n'est pas nécessaire de connaître une expression de ℓ.</li></ol>`
},
{
c:"convergence",level:3,title:"DS 12 — Contrôle d'erreur",
q:`<ol><li>Soit u₀∈[0,2] et uₙ₊₁=(uₙ+2)/3. Montrer que [0,2] est stable.</li><li>Montrer |uₙ−1|≤3⁻ⁿ|u₀−1| et conclure.</li><li>Pour une précision ε&gt;0, donner une condition suffisante sur n.</li></ol>`,
a:`<ol><li>Si 0≤uₙ≤2, alors 2/3≤(uₙ+2)/3≤4/3≤2. La récurrence assure uₙ∈[0,2] pour tout n.</li><li>uₙ₊₁−1=(uₙ−1)/3. Par récurrence, |uₙ−1|=3⁻ⁿ|u₀−1|. Comme 3⁻ⁿ→0, uₙ→1. La monotonie n'était pas nécessaire.</li><li>Une condition suffisante est 3⁻ⁿ|u₀−1|&lt;ε. Si u₀=1, l'erreur est toujours nulle ; sinon, on peut choisir n assez grand pour que 3ⁿ&gt;|u₀−1|/ε.</li></ol>`
}
];

const pages=document.getElementById("pages"),nav=document.getElementById("nav");
const escapeHTML=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const labelFor=id=>chapters.find(c=>c.id===id)?.title||id;
function details(head,body){return `<details><summary>${head}</summary><div class="answer">${body}</div></details>`}
function navButton(id,text){
 const b=document.createElement("button");b.type="button";b.textContent=text;b.dataset.go=id;
 b.addEventListener("click",()=>go(id));nav.append(b)
}
function label(text){const p=document.createElement("p");p.className="group-label";p.textContent=text;nav.append(p)}
label("Navigation");navButton("accueil","⌂  Accueil");
label("Cours séparés");chapters.forEach(c=>navButton(c.id,c.icon+"  "+c.title));
label("Entraînement");navButton("questions","?  Questions de cours");
navButton("colles","◆  32 khôlles corrigées");navButton("ds","✎  12 DS corrigés");
navButton("sources","↗  Sources et périmètre");

function page(id,html){const s=document.createElement("section");s.id=id;s.className="page";s.innerHTML=html;pages.append(s)}
page("accueil",`
<h2>Choisis un vrai chapitre</h2>
<p class="lead">Chaque onglet correspond à un cours indépendant. Les chapitres suivent la progression : fondements → dénombrement et structures → ordre et réels → suites et convergence.</p>
<div class="grid">${chapters.map(c=>`<div class="card"><span class="pill">Chapitre ${c.icon}</span><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.subtitle)}</p><button class="action" type="button" data-open="${c.id}">Ouvrir le chapitre</button></div>`).join("")}</div>
<div class="box good"><strong>Entraînement :</strong> ${questions.length} questions de cours, ${colles.length} khôlles et ${ds.length} DS. Les sujets sont originaux, classés par thème et difficulté ; chaque correction peut être ouverte séparément.</div>
<div class="box warn"><strong>Transparence :</strong> ce cours reprend les thèmes que tu as mentionnés ou qui ont été identifiés dans notre échange, dont les corps et les relations d'ordre. Je ne peux pas certifier une exploitation ligne à ligne de photos dont le texte exact n'est plus accessible ici.</div>`);

chapters.forEach(c=>{
 const index=`<div class="chapter-index"><strong>Dans ce chapitre :</strong><br>${c.blocks.map((b,i)=>`<a href="#${c.id}-${i}" data-anchor="${c.id}-${i}">${escapeHTML(b[0])}</a>`).join("")}</div>`;
 const blocks=c.blocks.map((b,i)=>`<article class="subtopic" id="${c.id}-${i}"><h3>${escapeHTML(b[0])}</h3>${b[1]}</article>`).join("");
 page(c.id,`<h2>${escapeHTML(c.title)}</h2><p class="lead">${escapeHTML(c.subtitle)}</p>${index}${blocks}<div class="box good"><strong>Après le cours :</strong> <button type="button" class="action" data-practice="colles" data-chapter="${c.id}">Khôlles de ce chapitre</button> <button type="button" class="action" data-practice="ds" data-chapter="${c.id}">DS de ce chapitre</button></div>`)
});
page("questions",`<h2>${questions.length} questions de cours</h2><p class="lead">Réponds d'abord à voix haute, puis ouvre la correction. Chaque question est rattachée à un chapitre précis.</p>
<div class="toolbar"><input id="q-search" type="search" placeholder="Rechercher une notion…" aria-label="Rechercher une question"><select id="q-filter" class="action" aria-label="Filtrer par chapitre"><option value="all">Tous les chapitres</option>${chapters.map(c=>`<option value="${c.id}">${escapeHTML(c.title)}</option>`).join("")}</select></div>
<p id="q-count" class="muted" aria-live="polite"></p><div id="q-list">${questions.map((q,i)=>`<article class="exercise" data-cat="${q[0]}"><span class="pill">${escapeHTML(labelFor(q[0]))} · Q${i+1}</span>${details(escapeHTML(q[1]),`<p>${escapeHTML(q[2])}</p>`)}</article>`).join("")}</div>`);
function makeBank(id,title,items){
 page(id,`<h2>${title}</h2><p class="lead">Chaque sujet est corrigé juste en dessous. Pour travailler réellement : ferme la correction, rédige sur papier, puis compare ligne à ligne.</p>
 <div class="toolbar"><input id="${id}-search" type="search" placeholder="Rechercher dans les sujets…" aria-label="Rechercher un sujet"><select id="${id}-filter" class="action" aria-label="Filtrer par chapitre"><option value="all">Tous les chapitres</option>${chapters.map(c=>`<option value="${c.id}">${escapeHTML(c.title)}</option>`).join("")}</select><select id="${id}-level" class="action" aria-label="Filtrer par niveau"><option value="all">Tous niveaux</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select></div>
 <p id="${id}-count" class="muted" aria-live="polite"></p><div id="${id}-list">${items.map((v,i)=>`<article class="exercise" data-cat="${v.c}" data-level="${v.level}"><span class="pill">${id==="colles"?"Khôlle":"DS"} ${String(i+1).padStart(2,"0")}</span><span class="pill">${escapeHTML(labelFor(v.c))}</span><span class="pill ${v.level===3?"hard":""}">${"★".repeat(v.level)}</span><h3>${escapeHTML(v.title)}</h3><div>${v.q}</div>${details("Afficher le corrigé détaillé",v.a)}</article>`).join("")}</div>`);
}

<ul>${sources.map(x=>`<li><a href="${escapeHTML(x[1])}" target="_blank" rel="noopener noreferrer">${escapeHTML(x[0])}</a> — ${escapeHTML(x[2])}</li>`).join("")}</ul>
<div class="box warn"><strong>Limite explicite :</strong> je n'ai pas reconstitué de blancs illisibles et je ne peux pas garantir ici que chaque ligne des photos initiales figure dans ce fichier. Il s'agit d'un cours organisé à partir des thèmes identifiés, complété avec des références de première année.</div>`);

document.querySelectorAll("[data-open]").forEach(x=>x.addEventListener("click",()=>go(x.dataset.open)));
document.querySelectorAll("[data-practice]").forEach(x=>x.addEventListener("click",()=>{
 go(x.dataset.practice);
 document.getElementById(x.dataset.practice+"-filter").value=x.dataset.chapter;
 refresh(x.dataset.practice)
}));
document.querySelectorAll("[data-anchor]").forEach(x=>x.addEventListener("click",e=>{
 e.preventDefault();document.getElementById(x.dataset.anchor)?.scrollIntoView({behavior:"smooth"})
}));
function norm(v){return v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function refresh(type){
 const items=[...document.querySelectorAll(`#${type}-list>.exercise`)];
 const text=norm(document.getElementById(type+"-search").value.trim());
 const cat=document.getElementById(type+"-filter").value;
 const lvl=type==="q"?"all":document.getElementById(type+"-level").value;
 let shown=0;
 items.forEach(item=>{
   const ok=(cat==="all"||item.dataset.cat===cat)&&(lvl==="all"||item.dataset.level===lvl)&&norm(item.textContent).includes(text);
   item.hidden=!ok;if(ok)shown++
 });
 document.getElementById(type+"-count").textContent=`${shown} sujet${shown>1?"s":""} affiché${shown>1?"s":""} sur ${items.length}.`
}
["q","colles","ds"].forEach(type=>{
 ["search","filter",...(type==="q"?[]:["level"])].forEach(field=>{
  const node=document.getElementById(type+"-"+field);
  node.addEventListener(field==="search"?"input":"change",()=>refresh(type))
 });
 refresh(type)
});
function go(id,hash=true){
 if(!document.getElementById(id)?.classList.contains("page"))id="accueil";
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
 document.querySelectorAll("nav button").forEach(b=>b.dataset.go===id?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
 const c=chapters.find(x=>x.id===id);
 document.getElementById("hero-title").textContent=c?c.title:id==="accueil"?"Un chapitre à la fois.":id==="questions"?"Savoir son cours.":id==="colles"?"Chercher, expliquer, démontrer.":id==="ds"?"Rédiger comme en DS.":"Sources vérifiables.";
 document.getElementById("hero-subtitle").textContent=c?c.subtitle:id==="accueil"?"Des chapitres séparés, des démonstrations, 32 khôlles et 12 DS corrigés.":id==="sources"?"Références de cours et limites clairement indiquées.":"Des sujets classés par chapitre et des corrigés à dévoiler.";
 if(hash)history.replaceState(null,"","#"+id);
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>go(location.hash.slice(1),false));
go(location.hash.slice(1)||"accueil",false);
</script>
